:root{--border:#e2e8f0;--text-muted:#475569}
/* Logo compatto, in alto a sinistra sopra le card */
.mission-brand{display:flex;align-items:center;min-width:0}
.mission-brand-name{font-family:"Trebuchet MS",Verdana,sans-serif;font-size:1.35rem;line-height:1.2;font-weight:700;letter-spacing:.015em;white-space:nowrap}
.mission-brand-name .brand-mat{color:#ffffff}
.mission-brand-name .brand-oro{color:#D4AF37}
/* Footer: stessi stili della pagina Circonferenza */
footer { border-top: 1px solid var(--border); margin-top: 3rem; padding: 0.7rem 2rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; font-size: 0.72rem; position: relative; z-index: 1; }
footer .footer-brand { font-weight: 700; white-space: nowrap; }
footer .footer-brand .brand-mat { color: #ffffff; }
footer .footer-brand .brand-viva { color: #D4AF37; }
footer .footer-center { color: #ffffff; text-align: center; flex: 1; }
footer .footer-center small { display: block; font-size: 0.67rem; color: #ffffff; margin-top: 0.15rem; }
footer .footer-copy { color: #ffffff; white-space: nowrap; text-align: right; }
@media (max-width: 650px) { footer { flex-direction: column; text-align: center; padding: 1rem; } }
/* Sfida finale: confronto visivo tra le due opzioni */
.money-chart-wrap{margin:18px 0;padding:14px;background:#0a203a;border:1px solid #355173;border-radius:15px}
.money-chart-wrap svg{width:100%;height:auto;display:block}

.money-key{display:inline-block;width:18px;height:4px;vertical-align:middle;margin-right:6px;border-radius:3px}
.money-key.fixed{background:#79b9ff}.money-key.growth{background:#f3c46b}
.money-chart-note{font-size:.82rem;color:#b9cee6;margin:8px 0 0}

/* Card 07: impaginazione dedicata, leggibile anche su proiettore e tablet */
#content.money-stage{background:radial-gradient(circle at 93% 0%,#23466d 0,transparent 37%),linear-gradient(145deg,#112d50,#0b1b32 76%);border-color:#52769c}
.money-stage .money-hero{display:grid;grid-template-columns:minmax(0,1fr) 185px;align-items:center;gap:16px;margin-bottom:18px}
.money-stage h1{font-size:clamp(2.1rem,4.7vw,3.4rem);margin:7px 0 8px;letter-spacing:-.035em}
.money-stage .money-subtitle{font-size:1.08rem;color:#e1eaf8;margin:0;line-height:1.5}
.money-stage .money-illustration{display:grid;place-items:center;min-height:145px;position:relative}
.money-stage .money-coin{width:116px;height:116px;display:grid;place-items:center;border-radius:50%;font-size:3.5rem;font-weight:900;color:#66420b;background:radial-gradient(circle at 35% 25%,#fff4b6,#f1c45f 48%,#a76d18 100%);border:7px double #ffe7a0;box-shadow:0 12px 35px #0008,0 0 45px #e5b95a40;transform:rotate(-12deg)}
.money-stage .money-stars{position:absolute;color:#ffe39b;font-size:1.5rem;top:2px;right:12px}
.money-stage .money-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:16px 0}
.money-stage .money-option{background:#102c4d;border:1px solid #54769b;border-radius:17px;padding:18px;display:flex;flex-direction:column;gap:9px;min-width:0}
.money-stage .money-option:nth-child(2){background:linear-gradient(145deg,#273951,#162e49);border-color:#aa884b}
.money-stage .money-option-label{font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:#e6c77f;font-weight:850}
.money-stage .money-option-value{font-size:clamp(1.3rem,2.5vw,2rem);font-weight:850;line-height:1.16;color:#fff}
.money-stage .money-option p{font-size:.94rem;line-height:1.5;margin:0;color:#d8e5f6;flex:1}
.money-stage .money-option button{width:100%;min-height:48px;border:1px solid #a2b9d7;background:#203e63;font-size:1rem}
.money-stage .money-option button.selected{background:#e6b451;color:#111d30;border-color:#ffe1a0;box-shadow:0 0 0 3px #e6b45144}
.money-stage .money-intro{font-size:1.08rem;font-weight:700;color:#f4d99a;margin:8px 0}
.money-stage .money-sim-intro{background:#173a5c;border-left:4px solid #f1c46c;border-radius:10px;padding:12px 16px;color:#e4efff;line-height:1.5;margin:14px 0}
.money-stage .money-sim-intro strong{color:#9a3412}
.money-stage .money-day{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:750;margin:18px 0 5px}
.money-stage .money-day strong{font-size:1.45rem;color:#f3c46b}
.money-stage #dayRange{accent-color:#f3c46b}
.money-stage .money-metrics{grid-template-columns:repeat(2,minmax(0,1fr));margin:16px 0}
.money-stage .money-metrics .metric{background:#0c2744;border-color:#42678c}
.money-stage .money-metrics .metric b{font-size:clamp(1.25rem,2.6vw,1.9rem);color:#fff}
.money-stage .money-chart-wrap{margin:14px 0;padding:12px 16px}
.money-stage .money-chart-legend{font-weight:700}
.money-stage .money-chart-wrap svg{max-height:260px}
.money-stage .money-chart-note{line-height:1.4}
.money-stage #moneyComparison{margin:12px 0}
.money-stage .money-controls{margin:14px 0}
.money-stage .money-controls button{min-height:44px}
.money-stage .money-final{background:linear-gradient(120deg,#1d513f,#163e46);border:1px solid #5bba91;border-radius:14px;padding:16px 18px;margin:14px 0;font-size:1.07rem;line-height:1.6}
.money-stage .money-final strong{color:#fff0b5}
@media(max-width:650px){.money-stage .money-hero{grid-template-columns:1fr}.money-stage .money-illustration{display:none}.money-stage .money-options{grid-template-columns:1fr}.money-stage .money-option{padding:15px}.money-stage .money-chart-wrap{padding:10px}.money-stage .money-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.money-stage .money-controls label{grid-column:1/-1}}

/* Monete illustrative nelle due opzioni: disposizione fissa, senza effetti sul calcolo */
.money-stage .coin-display{min-height:126px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:10px 5px;border-radius:12px;background:radial-gradient(ellipse at center,#2d4864,#0c233e);border:1px solid #4c6683}
.money-stage .coin-line{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:nowrap}
.money-stage .coin{width:25px;height:25px;flex:0 0 25px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:900;color:#68420a;background:radial-gradient(circle at 32% 25%,#fff4b5 0%,#f4cb69 40%,#b77b23 85%);border:2px solid #f8d988;box-shadow:inset 0 0 0 2px #d69d3b,0 3px 4px #0005}
.money-stage .coin-caption{font-size:.78rem;color:#c8d9ee;text-align:center;margin-top:4px}
@media(max-width:420px){.money-stage .coin{width:21px;height:21px;flex-basis:21px;font-size:10px}.money-stage .coin-line{gap:3px}}

/* Monete sovrapposte in pile: 1, 2, 4, 8 monete in altezza */
.money-stage .coin-display{min-height:142px;display:flex;flex-direction:row;align-items:flex-end;justify-content:center;gap:15px;padding:16px 8px 12px}
.money-stage .coin-stack{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:32px}
.money-stage .coin-stack .coin{display:block;flex:none;width:39px;height:16px;border-radius:50%;margin-top:-5px;position:relative;font-size:0;border:2px solid #fbe6a5;background:linear-gradient(180deg,#fff0a6 0%,#efbe55 48%,#a96b18 100%);box-shadow:0 5px 0 #9e661b,0 7px 3px #0007,inset 0 1px 2px #fff6c8}
.money-stage .coin-stack .coin:first-child{margin-top:0}
.money-stage .coin-stack .coin:last-child{background:radial-gradient(ellipse at 36% 26%,#fff7bd,#e9b74d 62%,#aa6d20);box-shadow:0 4px 0 #a46b1b,0 6px 3px #0007,inset 0 0 0 3px #e7aa3d}
.money-stage .coin-stack .coin:last-child:after{content:'€';position:absolute;inset:0;display:grid;place-items:center;color:#82510c;font-size:11px;font-weight:900}
.money-stage .coin-stack-label{font-size:.75rem;color:#d9e6f7;font-weight:750;margin-top:14px}
@media(max-width:420px){.money-stage .coin-display{gap:9px}.money-stage .coin-stack{min-width:27px}.money-stage .coin-stack .coin{width:33px;height:15px}}
.money-stage .money-photo{height:172px;border-radius:13px;overflow:hidden;background:#0b2343;border:1px solid #3d628b;display:flex;align-items:center;justify-content:center}.money-stage .money-photo img{width:100%;height:100%;object-fit:contain;display:block}.money-stage .money-option{justify-content:space-between}@media(max-width:650px){.money-stage .money-photo{height:160px}}

/* ===== Leggibilità su PC, tablet e cellulare ===== */
:root{--border:#355173;--fs:1}
html{font-size:calc(clamp(16px,.5vw + 14px,20px) * var(--fs));-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
.shell{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right));padding-top:max(20px,env(safe-area-inset-top))}
@media(min-width:1200px){.shell{max-width:1180px}}
@media(max-width:600px){.shell{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-top:max(12px,env(safe-area-inset-top))}}

/* Testi a tutta larghezza disponibile nella card, senza limite artificiale di 72 caratteri */
.panel p,.panel .notice{max-width:none}
.panel .ruleFormula,.panel .progressText{max-width:none}
.panel p{line-height:1.6}

/* dimensioni minime dei testi secondari */
footer{font-size:.875rem;padding:1rem 2rem}
footer .footer-center small{font-size:.8rem}
.eyebrow{font-size:.85rem}
.muted,.metric small,.ruleStep span,.ruleFormula small,.money-chart-legend,.money-chart-note,.money-stage .money-option-label,.money-stage .coin-caption,.money-stage .coin-stack-label{font-size:.875rem}
.travel-caption{font-size:1rem}
.money-stage .money-option p{font-size:1rem}
table{font-size:1rem}
summary{cursor:pointer;font-weight:700;padding:10px 0}

/* pulsanti: bersagli touch da almeno 44 px, stato disabilitato leggibile */
button{min-height:44px;touch-action:manipulation}
button:disabled{opacity:1;background:#0f2340;color:#8fa6c4;border-color:#2b4466}
.primary:disabled{background:#6b5a35;color:#efe3c3;border-color:#6b5a35}
.actions button{display:inline-flex;align-items:center;gap:.35em}
@media(max-width:560px){.actions{gap:6px}.actions button{min-width:44px;justify-content:center;padding:10px 14px}.actions button .tx{display:none}}

/* focus visibile (tastiera, telecomando LIM) */
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #ffd47a;outline-offset:3px}

/* cursori più facili da afferrare con il dito */
input[type=range]{-webkit-appearance:none;appearance:none;height:34px;background:transparent;margin:4px 0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:#2c4766}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:#e6b451;border:3px solid #fff3d0;box-shadow:0 2px 8px #0008}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:#2c4766}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#e6b451;border:3px solid #fff3d0}

/* avanzamento con etichetta di testo */
.stepper{margin:15px 0 8px}.stepper i{height:6px}
.stepLabel{margin:0 0 20px;color:#d5e1f3;font-weight:700;font-size:.95rem}
.bar{height:18px}

/* scena Terra-Luna proporzionale alla larghezza (niente misure fisse in px) */
.scene{height:auto;aspect-ratio:10/3;container-type:inline-size}
.scene .earth{width:17cqw;height:17cqw;left:8%;bottom:-7cqw}
.scene .moon{width:10cqw;height:10cqw;right:13%;top:10%}
.scene .paper{width:12cqw;height:8cqw;left:calc(50% - 6cqw);top:36%}
@media(max-width:600px){.scene{aspect-ratio:16/9}.scene .earth{width:30cqw;height:30cqw;left:0;bottom:-12cqw}.scene .moon{width:17cqw;height:17cqw;right:6%;top:12%}.scene .paper{width:20cqw;height:13.5cqw;left:calc(50% - 10cqw);top:38%}}

/* testi dentro gli SVG: leggibili dopo il ridimensionamento */
.travel-illustration .svgLabel{font-size:20px}
.travel-illustration .svgNote{font-size:16px}
.travel-note{display:none}
.chart text{font-size:14px}
.money-stage .money-chart-wrap svg{max-height:340px}

/* tablet e desktop: metriche su 4 colonne */
@media(min-width:820px){.metrics:not(.money-metrics){grid-template-columns:repeat(4,minmax(0,1fr))}}

/* cellulare */
.panel{--pad:clamp(20px,4vw,42px);padding:var(--pad)}
@media(max-width:600px){.panel{--pad:19px}}
@media(max-width:650px){
  .travel-illustration .svgLabel{font-size:34px}
  .travel-illustration .svgNote{display:none}
  .travel-note{display:block;text-align:center;color:#c9d9ed;font-size:.9rem;padding:0 8px 4px}
  .chart text{font-size:15px}
  .money-stage .money-chart-wrap svg{max-height:none}
  .controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .controls label{grid-column:1/-1;display:flex;align-items:center;gap:10px}
  .controls select{width:auto;flex:1}
  .footerNav{position:sticky;bottom:0;z-index:5;flex-wrap:nowrap;margin:24px calc(var(--pad) * -1) calc(var(--pad) * -1);padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));background:rgba(8,22,42,.97);border-top:1px solid #355173;border-radius:0 0 22px 22px}
  .footerNav button{flex:1}
}
@media(max-width:480px){td,th{padding:10px 8px}}

/* Logo istituzionale */
.mission-brand{gap:14px;flex-wrap:wrap}.school-logo{display:block;width:118px;height:auto;background:#fff;padding:7px;border-radius:8px;flex:none}@media(max-width:600px){.school-logo{width:94px}.mission-brand{gap:9px}}

/* Interfaccia compatta per la proiezione */
html{font-size:calc(clamp(13.6px,.425vw + 11.9px,17px) * var(--fs))}
.shell{padding-top:12px;padding-bottom:12px}
main{margin-top:18px}
.panel{--pad:clamp(15px,3vw,31.5px)}

.school-logo{width:94px;padding:5px}

/* Logo centrato, comandi su riga separata per evitare sovrapposizioni. */
header{flex-direction:column;align-items:center;gap:6px}header .mission-brand{width:100%;justify-content:center}header .actions{justify-content:center;flex-wrap:wrap}
.panel .bar-explanation{margin:8px 0 12px;line-height:1.5}

/* Card 3: contrasto delle informazioni sulla scena scura */
.panel .travel-illustration .travel-caption,
.panel .travel-illustration .travel-caption strong { color: #ffffff !important; }

.travel-extra-controls{justify-content:flex-start;align-items:center}.travel-extra-controls label{display:flex;align-items:center;gap:8px}.travel-extra-controls select{width:auto}

/* Intestazione istituzionale */

header .school-logo{justify-self:start;max-width:100%;padding:0}
.school-heading{text-align:center;font-family:"Trebuchet MS",Verdana,sans-serif;font-weight:800;line-height:1.18;letter-spacing:.035em;color:#16365c;font-size:clamp(.75rem,2.1vw,1.4rem)}

/* Tipografia classica dell'intestazione istituzionale */
.school-heading{font-family:"Cinzel",Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:.085em}
.school-heading strong{font-family:inherit;font-weight:700;letter-spacing:.16em;color:#a67520}
.school-heading strong::after{content:"";display:block;width:48%;max-width:270px;height:1px;background:#a67520;margin:5px auto 0}
@media(max-width:600px){.school-heading{letter-spacing:.025em}.school-heading strong{letter-spacing:.07em}}

/* Barra strumenti discreta, indipendente dall'intestazione */

.floating-tools .tx{display:none!important}

else if(state.stage===1){c.innerHTML=`<div class="eyebrow">02 · Il primo esperimento</div><h1>Che cosa succede a ogni piega?</h1><p>Osserva i primi raddoppi. Questa è una rappresentazione <strong>schematica</strong>: non mostra la difficoltà fisica di piegare davvero il foglio.</p><div class="stack"><div id="stack"></div></div><div class="metrics"><div class="metric"><small>Piegature</small><b id="foldNumber"></b></div><div class="metric"><small>Strati</small><b id="layers"></b></div><div class="metric"><small>Spessore</small><b id="thick"></b></div><div class="metric"><small>Rispetto all'inizio</small><b id="multiple"></b></div></div><div class="controls"><button id="fold" class="primary">Piega il foglio</button><button id="unfold">← Una piega indietro</button></div><div class="tablewrap"><table><thead><tr><th>Piegature</th><th>Strati</th><th>Spessore (mm)</th></tr></thead><tbody id="foldTable"></tbody></table></div><div class="notice"><strong>Indaga:</strong> di quanto si moltiplica lo spessore a ogni piegatura?</div><div class="choice" id="recognition"><button data-answer="1.5">× 1,5</button><button data-answer="2">× 2</button><button data-answer="3">× 3</button></div><div id="feedback" role="status"></div>${nav(true,state.recognized&&state.fold>=3)}`;function upd(){const f=state.fold;$('foldNumber').textContent=f;$('layers').textContent=fmt(2**f,0);$('thick').textContent=fmt(.1*2**f,3)+' mm';$('multiple').textContent='× '+fmt(2**f,0);$('stack').style.height=Math.min(120,12+f*14)+'px';$('fold').disabled=f>=8;$('unfold').disabled=f<=0;$('foldTable').innerHTML=Array.from({length:f+1},(_,i)=>`<tr><td>${i}</td><td>${fmt(2**i,0)}</td><td>${fmt(.1*2**i,3)}</td></tr>`).join('');$('next').disabled=!(state.recognized&&f>=3)}upd();$('fold').onclick=()=>{state.fold=Math.min(8,state.fold+1);$('stack').classList.remove('fold');void $('stack').offsetWidth;$('stack').classList.add('fold');upd();save()};$('unfold').onclick=()=>{state.fold=Math.max(0,state.fold-1);upd();save()};$('recognition').onclick=e=>{const b=e.target.closest('button[data-answer]');if(!b)return;if(b.dataset.answer==='2'){state.recognized=true;$('feedback').textContent='Esatto! Ogni piegatura raddoppia lo spessore.';upd();save()}else $('feedback').textContent='Osserva due righe consecutive della tabella e riprova.'};bindNav(true,state.recognized&&state.fold>=3)}
else if(state.stage===2){c.innerHTML=`<div class="eyebrow">03 · Il viaggio</div><h1>Quanto lontano possiamo arrivare?</h1>${travelScene()}<p class="bar-explanation">Ogni piegatura raddoppia lo spessore teorico del foglio. Nell’immagine qui sopra, la lunghezza del foglio rappresenta la <strong>frazione della distanza Terra-Luna raggiunta</strong>, in scala lineare. Per questo, durante le prime piegature, la sua crescita è quasi impercettibile.</p><label for="simRange">Piegature: <strong id="simLabel"></strong></label><input id="simRange" type="range" min="0" max="42" step="1" value="${state.sim}"><div class="metrics"><div class="metric"><small>Numero di strati</small><b id="simLayers"></b></div><div class="metric"><small>Spessore teorico</small><b id="simKm"></b></div><div class="metric"><small>Distanza ancora da percorrere</small><b id="remaining"></b></div><div class="metric"><small>Percentuale della distanza Terra-Luna raggiunta</small><b id="comparison"></b></div></div><div class="controls"><button id="play" class="primary">▶ Avvia</button><button id="prev">← Passaggio precedente</button><button id="step">Passaggio successivo →</button><button id="restart">↺ Ricomincia</button><label>Velocità <select id="speed"><option value=".5">Lenta</option><option value="1">Normale</option><option value="2">Veloce</option><option value="4">Molto veloce</option></select></label></div><div class="notice" id="milestone"></div>${nav(true,state.sim===42)}`;$('speed').value=String(state.speed);function upd(){let n=state.sim,k=km(n);$('simRange').value=n;$('simLabel').textContent=n;$('simLayers').textContent=fmt(2**n,0);$('simKm').textContent=k<.001?fmt(k*1e6,3)+' mm':k<1?fmt(k*1000,3)+' m':fmt(k,3)+' km';$('remaining').textContent=fmt(Math.max(0,MOON-k),3)+' km';$('comparison').textContent=fmt(100*k/MOON,2)+'%';const travelFraction=Math.min(1,k/MOON),travelEnd=193+travelFraction*521,travelHeight=7,travelY=130-travelHeight/2;$('travelPaperBody').setAttribute('width',String(Math.max(3,travelEnd-190)));$('travelPaperBody').setAttribute('height',String(travelHeight));$('travelPaperBody').setAttribute('y',String(travelY));$('travelPaperShadow').setAttribute('width',String(Math.max(3,travelEnd-190)));$('travelPaperShadow').setAttribute('height',String(travelHeight));$('travelPaperShadow').setAttribute('y',String(travelY));$('travelPaperTop').setAttribute('d',`M190 ${travelY+2} H${travelEnd}`);$('travelPaperTip').setAttribute('cx',String(travelEnd));$('travelFoldCount').textContent=n;$('travelThickness').textContent=k<.001?fmt(k*1e6,3)+' mm':k<1?fmt(k*1000,3)+' m':fmt(k,3)+' km';$('milestone').textContent=k>=MOON?'Hai raggiunto la distanza media della Luna! Prosegui per scoprire il risultato.':k>=100?'Hai superato i 100 km: una quota spesso usata come riferimento per l’inizio dello spazio.':k>=1?'Lo spessore supera un chilometro.':k>=.001?'Hai superato un metro.':'Osserva: i primi raddoppi sono quasi invisibili rispetto alla distanza della Luna.';$('next').disabled=n!==42;$('prev').disabled=n===0;$('step').disabled=n===42;$('play').textContent=state.playing?'Ⅱ Pausa':'▶ Avvia';save()}function advance(){if(state.sim<42){state.sim++;upd()}if(state.sim===42)stop()}function tick(t){if(!state.playing)return;if(!last)last=t;acc+=Math.min(100,t-last);last=t;const interval=700/state.speed;if(acc>=interval){acc%=interval;advance()}if(state.playing)raf=requestAnimationFrame(tick);else upd()}$('play').onclick=()=>{if(state.playing){stop();upd()}else{if(state.sim===42)state.sim=0;state.playing=true;last=0;acc=0;upd();raf=requestAnimationFrame(tick)}};$('step').onclick=()=>{stop();advance();upd()};$('prev').onclick=()=>{stop();state.sim=Math.max(0,state.sim-1);upd()};$('restart').onclick=()=>{stop();state.sim=0;upd()};$('simRange').oninput=e=>{stop();state.sim=Number(e.target.value);upd()};$('speed').onchange=e=>{state.speed=Number(e.target.value);save()};upd();bindNav(true,state.sim===42)}
else if(state.stage===3){const k41=km(41),k42=km(42);c.innerHTML=`<div class="eyebrow">04 · La rivelazione</div><h1>Il mistero è risolto</h1>${scene()}<div class="reveal">42</div><div class="progressText">piegature teoriche</div><p>Con 41 piegature lo spessore è <strong>${fmt(k41,3)} km</strong>: non basta. Con 42 piegature raggiunge <strong>${fmt(k42,3)} km</strong>, superando la distanza media Terra-Luna di 384.400 km.</p><div class="notice"><strong>Previsione iniziale:</strong> ${state.guess===null?'Non inserita':fmt(state.guess,0)+' piegature'}</div><div class="notice">La matematica può sorprenderci proprio quando la nostra intuizione sembra più sicura. Una previsione diversa dal risultato è un ottimo punto di partenza per capire perché.</div>${nav(true,true)}`;bindNav(true,true)}
else if(state.stage===4){let n=foldNeeded(state.thickness);c.innerHTML=`<div class="eyebrow">05 · Scopri la regola</div><h1>La potenza nascosta</h1><p>Partiamo da un foglio spesso <strong>0,1 mm</strong>. Ogni volta che lo pieghiamo, lo spessore <strong>raddoppia</strong>: non aggiungiamo sempre 0,1 mm, ma moltiplichiamo per 2 il valore precedente.</p><div class="ruleSteps" aria-label="Costruzione progressiva della formula"><div class="ruleStep"><small>0 piegature</small><strong>0,1 mm</strong><span>Spessore iniziale</span></div><div class="ruleArrow" aria-hidden="true">× 2 →</div><div class="ruleStep"><small>1 piegatura</small><strong>0,2 mm</strong><span>0,1 × 2</span></div><div class="ruleArrow" aria-hidden="true">× 2 →</div><div class="ruleStep"><small>2 piegature</small><strong>0,4 mm</strong><span>0,1 × 2 × 2</span></div><div class="ruleArrow" aria-hidden="true">× 2 →</div><div class="ruleStep"><small>3 piegature</small><strong>0,8 mm</strong><span>0,1 × 2 × 2 × 2</span></div></div><p>Il numero di fattori <strong>2</strong> è uguale al numero delle piegature. Per questo possiamo scrivere:</p><div class="notice ruleFormula"><div>0,1 × 2 × 2 × … × 2</div><div class="ruleFormulaArrow" aria-hidden="true">↓</div><strong>s(n) = 0,1 × 2<sup>n</sup> mm</strong><small>n = numero di piegature · 2<sup>n</sup> = prodotto di n fattori uguali a 2</small></div><p>Ora osserva la <strong>curva dorata</strong>: rappresenta soltanto lo spessore del foglio che raddoppia. Sposta il cursore per scoprire come cambia il grafico.</p><label>Mostra fino a <strong id="maxN">${state.chartMax}</strong> piegature<input type="range" id="chartRange" min="3" max="25" value="${state.chartMax}"></label><div class="notice" id="chartValue" aria-live="polite"></div><svg id="growthChart" class="chart" viewBox="0 0 640 300" role="img" aria-label="Grafico dello spessore esponenziale del foglio in funzione delle piegature"></svg><p class="muted">Curva dorata: crescita esponenziale. Asse orizzontale: piegature. Asse verticale: spessore in millimetri; la scala si adatta al numero massimo di piegature selezionato.</p><div class="field"><label>Spessore iniziale (mm)<input id="thickness" type="number" min="0.000001" max="1000000" step="any" value="${state.thickness}"></label><button id="applyThickness">Ricalcola</button></div><div class="notice" id="thicknessResult">Con ${fmt(state.thickness,6)} mm occorrono <strong>${n} piegature</strong> per raggiungere la distanza media Terra-Luna.</div><details><summary>Altre domande da esplorare</summary><p>Se il foglio è spesso 0,2 mm, serve una piegatura in meno. Per raggiungere 1 km con un foglio spesso 0,1 mm servono <strong>${foldNeeded(.1,1)}</strong> piegature. Ogni nuova piegatura moltiplica per due il risultato precedente.</p></details>${nav(true,true)}`;function chart(){let N=state.chartMax,max=.1*2**N;$('chartValue').innerHTML=`Dopo <strong>${N} piegature</strong>: spessore <strong>${fmt(max,2)} mm</strong> (${fmt(max/1000,5)} m).`; const mob=mqMobile.matches,W=mob?400:640,L=mob?84:104,Rr=W-30,PH=mob?240:215,B=mob?290:260,H=B+40,X=n=>L+n/N*(Rr-L),Y=y=>B-y/max*PH,tl=v=>fmt(v,mob&&v>=1000?0:2);const points=Array.from({length:N+1},(_,i)=>`${X(i)},${Y(.1*2**i)}`).join(' ');const ticks=[0,.25,.5,.75,1].map(fr=>`<line x1="${L}" y1="${Y(max*fr)}" x2="${Rr}" y2="${Y(max*fr)}" stroke="#344b67" stroke-dasharray="4 5"/><text x="${L-8}" y="${Y(max*fr)+5}" text-anchor="end">${tl(max*fr)}</text>`).join('');$('growthChart').setAttribute('viewBox','0 0 '+W+' '+H);$('growthChart').innerHTML=`${ticks}<line x1="${L}" y1="${B}" x2="${Rr}" y2="${B}" stroke="#7895b8"/><line x1="${L}" y1="${B-PH-20}" x2="${L}" y2="${B}" stroke="#7895b8"/><polyline points="${points}" fill="none" stroke="#f3c46b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(N)}" cy="${Y(max)}" r="5" fill="#f3c46b"/><text x="${L}" y="${B+26}">0</text><text x="${Rr}" y="${B+26}" text-anchor="end">${N} piegature</text><text x="${L}" y="18">Spessore (mm)</text>`}$('chartRange').oninput=e=>{state.chartMax=Number(e.target.value);$('maxN').textContent=state.chartMax;chart();save()};$('applyThickness').onclick=()=>{let t=Number($('thickness').value);if(!Number.isFinite(t)||t<.000001||t>1000000){$('thicknessResult').textContent='Inserisci uno spessore compreso tra 0,000001 e 1.000.000 mm.';return}state.thickness=t;$('thicknessResult').innerHTML=`Con ${fmt(t,6)} mm occorrono <strong>${foldNeeded(t)} piegature</strong> per raggiungere la distanza media Terra-Luna.`;save()};onMq=chart;chart();bindNav(true,true)}
else if(state.stage===5){c.innerHTML=`<div class="eyebrow">06 · Realtà o matematica?</div><h1>Un modello non è la realtà</h1>${scene()}<p>La matematica descrive cosa accadrebbe <strong>se</strong> lo spessore potesse raddoppiare a ogni piegatura, senza altri limiti.</p><div class="notice"><strong>Nel mondo reale:</strong> un normale foglio non può essere piegato 42 volte. Le sue dimensioni, la rigidità e la deformazione della carta rendono impossibile proseguire indefinitamente.</div><p>La distanza di <strong>384.400 km</strong> è una media: la Luna si avvicina e si allontana dalla Terra durante la sua orbita. L'esperimento usa una distanza di riferimento fissa.</p><p>La potenza del modello sta nel rendere comprensibile una crescita rapidissima, non nel promettere un viaggio fisicamente realizzabile.</p>${nav(true,true)}`;bindNav(true,true)}
