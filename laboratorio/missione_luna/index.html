:root{--border:#e2e8f0;--text-muted:#475569}
/* Logo compatto, in alto a sinistra sopra le card */
.mission-brand{display:flex;align-items:center;min-width:0}
.mission-brand-name{font-family:"Trebuchet MS",Verdana,sans-serif;font-size:1.35rem;line-height:1.2;font-weight:700;letter-spacing:.015em;white-space:nowrap}
.mission-brand-name .brand-mat{color:#ffffff}
.mission-brand-name .brand-oro{color:#D4AF37}
/* Footer: stessi stili della pagina Circonferenza */
footer { border-top: 1px solid var(--border); margin-top: 3rem; padding: 0.7rem 2rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; font-size: 0.72rem; position: relative; z-index: 1; }
footer .footer-brand { font-weight: 700; white-space: nowrap; }
footer .footer-brand .brand-mat { color: #ffffff; }
footer .footer-brand .brand-viva { color: #D4AF37; }
footer .footer-center { color: #ffffff; text-align: center; flex: 1; }
footer .footer-center small { display: block; font-size: 0.67rem; color: #ffffff; margin-top: 0.15rem; }
footer .footer-copy { color: #ffffff; white-space: nowrap; text-align: right; }
@media (max-width: 650px) { footer { flex-direction: column; text-align: center; padding: 1rem; } }
/* Sfida finale: confronto visivo tra le due opzioni */
.money-chart-wrap{margin:18px 0;padding:14px;background:#0a203a;border:1px solid #355173;border-radius:15px}
.money-chart-wrap svg{width:100%;height:auto;display:block}
.money-chart-legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px;font-size:.85rem;color:#dce8f7}
.money-key{display:inline-block;width:18px;height:4px;vertical-align:middle;margin-right:6px;border-radius:3px}
.money-key.fixed{background:#79b9ff}.money-key.growth{background:#f3c46b}
.money-chart-note{font-size:.82rem;color:#b9cee6;margin:8px 0 0}

/* Card 07: impaginazione dedicata, leggibile anche su proiettore e tablet */
#content.money-stage{background:radial-gradient(circle at 93% 0%,#23466d 0,transparent 37%),linear-gradient(145deg,#112d50,#0b1b32 76%);border-color:#52769c}
.money-stage .money-hero{display:grid;grid-template-columns:minmax(0,1fr) 185px;align-items:center;gap:16px;margin-bottom:18px}
.money-stage h1{font-size:clamp(2.1rem,4.7vw,3.4rem);margin:7px 0 8px;letter-spacing:-.035em}
.money-stage .money-subtitle{font-size:1.08rem;color:#e1eaf8;margin:0;line-height:1.5}
.money-stage .money-illustration{display:grid;place-items:center;min-height:145px;position:relative}
.money-stage .money-coin{width:116px;height:116px;display:grid;place-items:center;border-radius:50%;font-size:3.5rem;font-weight:900;color:#66420b;background:radial-gradient(circle at 35% 25%,#fff4b6,#f1c45f 48%,#a76d18 100%);border:7px double #ffe7a0;box-shadow:0 12px 35px #0008,0 0 45px #e5b95a40;transform:rotate(-12deg)}
.money-stage .money-stars{position:absolute;color:#ffe39b;font-size:1.5rem;top:2px;right:12px}
.money-stage .money-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:16px 0}
.money-stage .money-option{background:#102c4d;border:1px solid #54769b;border-radius:17px;padding:18px;display:flex;flex-direction:column;gap:9px;min-width:0}
.money-stage .money-option:nth-child(2){background:linear-gradient(145deg,#273951,#162e49);border-color:#aa884b}
.money-stage .money-option-label{font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:#e6c77f;font-weight:850}
.money-stage .money-option-value{font-size:clamp(1.3rem,2.5vw,2rem);font-weight:850;line-height:1.16;color:#fff}
.money-stage .money-option p{font-size:.94rem;line-height:1.5;margin:0;color:#d8e5f6;flex:1}
.money-stage .money-option button{width:100%;min-height:48px;border:1px solid #a2b9d7;background:#203e63;font-size:1rem}
.money-stage .money-option button.selected{background:#e6b451;color:#111d30;border-color:#ffe1a0;box-shadow:0 0 0 3px #e6b45144}
.money-stage .money-intro{font-size:1.08rem;font-weight:700;color:#f4d99a;margin:8px 0}
.money-stage .money-sim-intro{background:#173a5c;border-left:4px solid #f1c46c;border-radius:10px;padding:12px 16px;color:#e4efff;line-height:1.5;margin:14px 0}
.money-stage .money-sim-intro strong{color:#fff}
.money-stage .money-day{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:750;margin:18px 0 5px}
.money-stage .money-day strong{font-size:1.45rem;color:#f3c46b}
.money-stage #dayRange{accent-color:#f3c46b}
.money-stage .money-metrics{grid-template-columns:repeat(2,minmax(0,1fr));margin:16px 0}
.money-stage .money-metrics .metric{background:#0c2744;border-color:#42678c}
.money-stage .money-metrics .metric b{font-size:clamp(1.25rem,2.6vw,1.9rem);color:#fff}
.money-stage .money-chart-wrap{margin:14px 0;padding:12px 16px}
.money-stage .money-chart-legend{font-weight:700}
.money-stage .money-chart-wrap svg{max-height:260px}
.money-stage .money-chart-note{line-height:1.4}
.money-stage #moneyComparison{margin:12px 0}
.money-stage .money-controls{margin:14px 0}
.money-stage .money-controls button{min-height:44px}
.money-stage .money-final{background:linear-gradient(120deg,#1d513f,#163e46);border:1px solid #5bba91;border-radius:14px;padding:16px 18px;margin:14px 0;font-size:1.07rem;line-height:1.6}
.money-stage .money-final strong{color:#fff0b5}
@media(max-width:650px){.money-stage .money-hero{grid-template-columns:1fr}.money-stage .money-illustration{display:none}.money-stage .money-options{grid-template-columns:1fr}.money-stage .money-option{padding:15px}.money-stage .money-chart-wrap{padding:10px}.money-stage .money-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.money-stage .money-controls label{grid-column:1/-1}}

/* Monete illustrative nelle due opzioni: disposizione fissa, senza effetti sul calcolo */
.money-stage .coin-display{min-height:126px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:10px 5px;border-radius:12px;background:radial-gradient(ellipse at center,#2d4864,#0c233e);border:1px solid #4c6683}
.money-stage .coin-line{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:nowrap}
.money-stage .coin{width:25px;height:25px;flex:0 0 25px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:900;color:#68420a;background:radial-gradient(circle at 32% 25%,#fff4b5 0%,#f4cb69 40%,#b77b23 85%);border:2px solid #f8d988;box-shadow:inset 0 0 0 2px #d69d3b,0 3px 4px #0005}
.money-stage .coin-caption{font-size:.78rem;color:#c8d9ee;text-align:center;margin-top:4px}
@media(max-width:420px){.money-stage .coin{width:21px;height:21px;flex-basis:21px;font-size:10px}.money-stage .coin-line{gap:3px}}

/* Monete sovrapposte in pile: 1, 2, 4, 8 monete in altezza */
.money-stage .coin-display{min-height:142px;display:flex;flex-direction:row;align-items:flex-end;justify-content:center;gap:15px;padding:16px 8px 12px}
.money-stage .coin-stack{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:32px}
.money-stage .coin-stack .coin{display:block;flex:none;width:39px;height:16px;border-radius:50%;margin-top:-5px;position:relative;font-size:0;border:2px solid #fbe6a5;background:linear-gradient(180deg,#fff0a6 0%,#efbe55 48%,#a96b18 100%);box-shadow:0 5px 0 #9e661b,0 7px 3px #0007,inset 0 1px 2px #fff6c8}
.money-stage .coin-stack .coin:first-child{margin-top:0}
.money-stage .coin-stack .coin:last-child{background:radial-gradient(ellipse at 36% 26%,#fff7bd,#e9b74d 62%,#aa6d20);box-shadow:0 4px 0 #a46b1b,0 6px 3px #0007,inset 0 0 0 3px #e7aa3d}
.money-stage .coin-stack .coin:last-child:after{content:'€';position:absolute;inset:0;display:grid;place-items:center;color:#82510c;font-size:11px;font-weight:900}
.money-stage .coin-stack-label{font-size:.75rem;color:#d9e6f7;font-weight:750;margin-top:14px}
@media(max-width:420px){.money-stage .coin-display{gap:9px}.money-stage .coin-stack{min-width:27px}.money-stage .coin-stack .coin{width:33px;height:15px}}
.money-stage .money-photo{height:172px;border-radius:13px;overflow:hidden;background:#0b2343;border:1px solid #3d628b;display:flex;align-items:center;justify-content:center}.money-stage .money-photo img{width:100%;height:100%;object-fit:contain;display:block}.money-stage .money-option{justify-content:space-between}@media(max-width:650px){.money-stage .money-photo{height:160px}}

 d="M60 114l29-5 21 7M124 75l23 13" fill="none" stroke="#d9ffff" stroke-width="7" opacity=".38" stroke-linecap="round"/><circle cx="784" cy="130" r="70" fill="#e9f0fa" opacity=".18" filter="url(#lunaGlow)"/><circle cx="784" cy="130" r="60" fill="url(#lunaMoon)"/><g fill="#8493a8" opacity=".42"><circle cx="766" cy="102" r="12"/><circle cx="809" cy="147" r="17"/><circle cx="770" cy="164" r="8"/><circle cx="815" cy="100" r="7"/><circle cx="790" cy="123" r="6"/></g><path d="M190 130H714" stroke="#c9d4e8" stroke-width="2" stroke-dasharray="6 9" opacity=".5"/><g id="travelPaperGroup"><rect id="travelPaperShadow" x="190" y="126" width="3" height="9" rx="3" fill="#f3c46b" opacity=".35" filter="url(#lunaGlow)"/><rect id="travelPaperBody" x="190" y="126" width="3" height="9" rx="2" fill="url(#lunaPaper)" stroke="#ffe6a0" stroke-width="1"/><path id="travelPaperTop" d="M190 126 H193" fill="none" stroke="#fff8e3" stroke-width="2"/><circle id="travelPaperTip" cx="193" cy="130" r="5" fill="#fff4c7" stroke="#f1bc4c" stroke-width="2"/></g><text x="110" y="240" text-anchor="middle" fill="#cfe7ff" font-size="18" font-weight="700">TERRA</text><text x="784" y="224" text-anchor="middle" fill="#e9e9f4" font-size="18" font-weight="700">LUNA</text><text x="455" y="248" text-anchor="middle" fill="#b9cce4" font-size="15">Avanzamento sulla stessa scala lineare della barra</text></svg><div class="travel-caption" aria-live="off">Spessore dopo <strong id="travelFoldCount">0</strong> piegature: <strong id="travelThickness">0,1 mm</strong></div></div>`}function render(){const labels=['La sfida','L’esperimento','Il viaggio','La rivelazione','La regola','Realtà e modello','Nuova sfida'];$('stepper').innerHTML=labels.map((x,i)=>`<i class="${i<=state.stage?'on':''}" title="${x}"></i>`).join('');const c=$('content');c.classList.toggle('money-stage',state.stage===6);if(state.stage===0){c.innerHTML=`<div class="eyebrow">01 · Il mistero</div><h1>Un foglio di carta può raggiungere la Luna?</h1>${scene()}<p>Un normalissimo foglio di carta è spesso appena <strong>0,1 millimetri</strong>. Immagina di piegarlo a metà, poi ancora a metà, e continuare così.</p><p><strong>Quante piegature servirebbero affinché il suo spessore raggiunga la distanza media tra la Terra e la Luna, circa 384.400 km?</strong></p><div class="controls" role="group" aria-label="Modalità di raccolta"><button type="button" id="singleMode" aria-pressed="${!classMode}">Una previsione</button><button type="button" id="classMode" aria-pressed="${classMode}">Previsioni della classe</button></div><p class="muted">Scegli una modalità: una sola risposta oppure fino a 50 previsioni della classe. Non occorre compilare entrambe.</p><div class="${classMode?'hidden':''}"><form id="guessForm" class="field"><label>La tua previsione<input id="guess" type="number" min="0" max="1000000000" step="1" inputmode="numeric" required placeholder="Scrivi un numero" ${state.guess!==null?'disabled value="'+state.guess+'"':''}></label><button class="primary" type="submit" ${state.guess!==null?'disabled':''}>Conferma la mia previsione</button></form><div id="err" role="alert"></div>${state.guess!==null?`<div class="notice">Previsione registrata: <strong>${fmt(state.guess,0)} piegature</strong>. Non sarà modificata durante l'esperienza.</div>`:''}</div><div class="${classMode?'':'hidden'}"><form id="classForm" class="field"><label>Studente (numero da 1 a 50)<input id="studentNo" type="number" min="1" max="50" step="1" required value="${Math.min(50,classPredictions.length+1)}"></label><label>Previsione (piegature)<input id="studentGuess" type="number" min="0" max="1000000000" step="1" required></label><button class="primary">Registra</button></form><div id="classError" role="alert"></div><div class="tablewrap"><table><thead><tr><th>Studente</th><th>Previsione</th><th></th></tr></thead><tbody>${classPredictions.map(x=>`<tr><td>${x.id}</td><td>${fmt(x.value,0)}</td><td><button type="button" data-remove="${x.id}">Elimina</button></td></ else if(state.stage===1){c.innerHTML=`<div class="eyebrow">02 · Il primo esperimento</div><h1>Che cosa succede a ogni piega?</h1><p>Osserva i primi raddoppi. Questa è una rappresentazione <strong>schematica</strong>: non mostra la difficoltà fisica di piegare davvero il foglio.</p><div class="stack"><div id="stack"></div></div><div class="metrics"><div class="metric"><small>Piegature</small><b id="foldNumber"></b></div><div class="metric"><small>Strati</small><b id="layers"></b></div><div class="metric"><small>Spessore</small><b id="thick"></b></div><div class="metric"><small>Rispetto all'inizio</small><b id="multiple"></b></div></div><div class="controls"><button id="fold" class="primary">Piega il foglio</button><button id="unfold">← Una piega indietro</button></div><div class="tablewrap"><table><thead><tr><th>Piegature</th><th>Strati</th><th>Spessore (mm)</th></tr></thead><tbody id="foldTable"></tbody></table></div><div class="notice"><strong>Indaga:</strong> di quanto si moltiplica lo spessore a ogni piegatura?</div><div class="choice" id="recognition"><button data-answer="1.5">× 1,5</button><button data-answer="2">× 2</button><button data-answer="3">× 3</button></div><div id="feedback" role="status"></div>${nav(true,state.recognized&&state.fold>=3)}`;function upd(){const f=state.fold;$('foldNumber').textContent=f;$('layers').textContent=fmt(2**f,0);$('thick').textContent=fmt(.1*2**f,3)+' mm';$('multiple').textContent='× '+fmt(2**f,0);$('stack').style.height=Math.min(120,12+f*14)+'px';$('fold').disabled=f>=8;$('unfold').disabled=f<=0;$('foldTable').innerHTML=Array.from({length:f+1},(_,i)=>`<tr><td>${i}</td><td>${fmt(2**i,0)}</td><td>${fmt(.1*2**i,3)}</td></tr>`).join('');$('next').disabled=!(state.recognized&&f>=3)}upd();$('fold').onclick=()=>{state.fold=Math.min(8,state.fold+1);$('stack').classList.remove('fold');void $('stack').offsetWidth;$('stack').classList.add('fold');upd();save()};$('unfold').onclick=()=>{state.fold=Math.max(0,state.fold-1);upd();save()};$('recognition').onclick=e=>{const b=e.target.closest('button[data-answer]');if(!b)return;if(b.dataset.answer==='2'){state.recognized=true;$('feedback').textContent='Esatto! Ogni piegatura raddoppia lo spessore.';upd();save()}else $('feedback').textContent='Osserva due righe consecutive della tabella e riprova.'};bindNav(true,state.recognized&&state.fold>=3)}
else if(state.stage===2){c.innerHTML=`<div class="eyebrow">03 · Il viaggio</div><h1>Quanto lontano possiamo arrivare?</h1>${travelScene()}<label for="simRange">Piegature: <strong id="simLabel"></strong></label><input id="simRange" type="range" min="0" max="42" step="1" value="${state.sim}"><div class="metrics"><div class="metric"><small>Numero di strati</small><b id="simLayers"></b></div><div class="metric"><small>Spessore teorico</small><b id="simKm"></b></div><div class="metric"><small>Distanza ancora da percorrere</small><b id="remaining"></b></div><div class="metric"><small>Confronto</small><b id="comparison"></b></div></div><p class="bar-explanation">Ogni passo raddoppia lo spessore teorico. La barra qui sotto indica la <strong>frazione della distanza Terra-Luna raggiunta</strong> ed è in scala lineare; per questo all’inizio sembra immobile.</p><div class="bar-arrow" aria-hidden="true">↓</div><div class="bar"><div id="distanceBar"></div></div><div class="controls"><button id="play" class="primary">▶ Avvia</button><button id="prev">← Passaggio precedente</button><button id="step">Passaggio successivo →</button><button id="restart">↺ Ricomincia</button><label>Velocità <select id="speed"><option value=".5">Lenta</option><option value="1">Normale</option><option value="2">Veloce</option><option value="4">Molto veloce</option></select></label></div><div class="notice" id="milestone"></div><p class="muted">Confronti indicativi: 1 m = 0,001 km; 1 km = 1 km; quota di 100 km come riferimento convenzionale per il limite dello spazio.</p>${nav(true,state.sim===42)}`;$('speed').value=String(state.speed);function upd(){let n=state.sim,k=km(n);$('simRange').value=n;$('simLabel').textContent=n;$('simLayers').textContent=fmt(2**n,0);$('simKm').textContent=k<.001?fmt(k*1e6,3)+' mm':k<1?fmt(k*1000,3)+' m':fmt(k,3)+' km';$('remaining').textContent=fmt(Math.max(0,MOON-k),3)+' km';$('comparison').textContent=k>=MOON?'Distanza superata':k>=100?'Oltre 100 km':k>=1?'Oltre 1 km':k>=.001?'Oltre 1 m':'Meno di 1 m';$('distanceBar').style.width=Math.min(100,k/MOON*100)+'%';const travelFraction=Math.min(1,k/MOON),travelEnd=193+travelFraction*521,travelHeight=9+travelFraction*35,travelY=130-travelHeight/2;$('travelPaperBody').setAttribute('width',String(Math.max(3,travelEnd-190)));$('travelPaperBody').setAttribute('height',String(travelHeight));$('travelPaperBody').setAttribute('y',String(travelY));$('travelPaperShadow').setAttribute('width',String(Math.max(3,travelEnd-190)));$('travelPaperShadow').setAttribute('height',String(travelHeight));$('travelPaperShadow').setAttribute('y',String(travelY));$('travelPaperTop').setAttribute('d',`M190 ${travelY+2} H${travelEnd}`);$('travelPaperTip').setAttribute('cx',String(travelEnd));$('travelFoldCount').textContent=n;$('travelThickness').textContent=k<.001?fmt(k*1e6,3)+' mm':k<1?fmt(k*1000,3)+' m':fmt(k,3)+' km';$('milestone').textContent=k>=MOON?'Hai raggiunto la distanza media della Luna! Prosegui per scoprire il risultato.':k>=100?'Hai superato i 100 km: una quota spesso usata come riferimento per l’inizio dello spazio.':k>=1?'Lo spessore supera un chilometro.':k>=.001?'Hai superato un metro.':'Osserva: i primi raddoppi sono quasi invisibili rispetto alla distanza della Luna.';$('next').disabled=n!==42;$('prev').disabled=n===0;$('step').disabled=n===42;$('play').textContent=state.playing?'Ⅱ Pausa':'▶ Avvia';save()}function advance(){if(state.sim<42){state.sim++;upd()}if(state.sim===42)stop()}function tick(t){if(!state.playing)return;if(!last)last=t;acc+=Math.min(100,t-last);last=t;const interval=700/state.speed;if(acc>=interval){acc%=interval;advance()}if(state.playing)raf=requestAnimationFrame(tick);else upd()}$('play').onclick=()=>{if(state.playing){stop();upd()}else{if(state.sim===42)state.sim=0;state.playing=true;last=0;acc=0;upd();raf=requestAnimationFrame(tick)}};$('step').onclick=()=>{stop();advance();upd()};$('prev').onclick=()=>{stop();state.sim=Math.max(0,state.sim-1);upd()};$('restart').onclick=()=>{stop();state.sim=0;upd()};$('simRange').oninput=e=>{stop();state.sim=Number(e.target.value);upd()};$('speed').onchange=e=>{state.speed=Number(e.target.value);save()};upd();bindNav(true,state.sim===42)}
else if(state.stage===3){const k41=km(41),k42=km(42);c.innerHTML=`<div class="eyebrow">04 · La rivelazione</div><h1>Il mistero è risolto</h1>${scene()}<div class="reveal">42</div><div class="progressText">piegature teoriche</div><p>Con 41 piegature lo spessore è <strong>${fmt(k41,3)} km</strong>: non basta. Con 42 piegature raggiunge <strong>${fmt(k42,3)} km</strong>, superando la distanza media Terra-Luna di 384.400 km.</p><div class="notice"><strong>Previsione iniziale:</strong> ${state.guess===null?'Non inserita':fmt(state.guess,0)+' piegature'}</div><div class="notice">La matematica può sorprenderci proprio quando la nostra intuizione sembra più sicura. Una previsione diversa dal risultato è un ottimo punto di partenza per capire perché.</div>${nav(true,true)}`;bindNav(true,true)}
else if(state.stage===4){let n=foldNeeded(state.thickness);c.innerHTML=`<div class="eyebrow">05 · Scopri la regola</div><h1>La potenza nascosta</h1><p>Partiamo da un foglio spesso <strong>0,1 mm</strong>. Ogni volta che lo pieghiamo, lo spessore <strong>raddoppia</strong>: non aggiungiamo sempre 0,1 mm, ma moltiplichiamo per 2 il valore precedente.</p><div class="ruleSteps" aria-label="Costruzione progressiva della formula"><div class="ruleStep"><small>0 piegature</small><strong>0,1 mm</strong><span>Spessore iniziale</span></div><div class="ruleArrow" aria-hidden="true">× 2 →</div><div class="ruleStep"><small>1 piegatura</small><strong>0,2 mm</strong><span>0,1 × 2</span></div><div class="ruleArrow" aria-hidden="true">× 2 →</div><div class="ruleStep"><small>2 piegature</small><strong>0,4 mm</strong><span>0,1 × 2 × 2</span></div><div class="ruleArrow" aria-hidden="true">× 2 →</div><div class="ruleStep"><small>3 piegature</small><strong>0,8 mm</strong><span>0,1 × 2 × 2 × 2</span></div></div><p>Il numero di fattori <strong>2</strong> è uguale al numero delle piegature. Per questo possiamo scrivere:</p><div class="notice ruleFormula"><div>0,1 × 2 × 2 × … × 2</div><div class="ruleFormulaArrow" aria-hidden="true">↓</div><strong>s(n) = 0,1 × 2<sup>n</sup> mm</strong><small>n = numero di piegature · 2<sup>n</sup> = prodotto di n fattori uguali a 2</small></div><p>Ora osserva la <strong>curva dorata</strong>: rappresenta soltanto lo spessore del foglio che raddoppia. Sposta il cursore per scoprire come cambia il grafico.</p><label>Mostra fino a <strong id="maxN">${state.chartMax}</strong> piegature<input type="range" id="chartRange" min="3" max="25" value="${state.chartMax}"></label><div class="notice" id="chartValue" aria-live="polite"></div><svg id="growthChart" class="chart" viewBox="0 0 640 300" role="img" aria-label="Grafico dello spessore esponenziale del foglio in funzione delle piegature"></svg><p class="muted">Curva dorata: crescita esponenziale. Asse orizzontale: piegature. Asse verticale: spessore in millimetri; la scala si adatta al numero massimo di piegature selezionato.</p><div class="field"><label>Spessore iniziale (mm)<input id="thickness" type="number" min="0.000001" max="1000000" step="any" value="${state.thickness}"></label><button id="applyThickness">Ricalcola</button></div><div class="notice" id="thicknessResult">Con ${fmt(state.thickness,6)} mm occorrono <strong>${n} piegature</strong> per raggiungere la distanza media Terra-Luna.</div><details><summary>Altre domande da esplorare</summary><p>Se il foglio è spesso 0,2 mm, serve una piegatura in meno. Per raggiungere 1 km con un foglio spesso 0,1 mm servono <strong>${foldNeeded(.1,1)}</strong> piegature. Ogni nuova piegatura moltiplica per due il risultato precedente.</p></details>${nav(true,true)}`;function chart(){let N=state.chartMax,max=.1*2**N;$('chartValue').innerHTML=`Dopo <strong>${N} piegature</strong>: spessore <strong>${fmt(max,2)} mm</strong> (${fmt(max/1000,5)} m).`; const X=n=>104+n/N*506,Y=y=>260-y/max*215;const points=Array.from({length:N+1},(_,i)=>`${X(i)},${Y(.1*2**i)}`).join(' ');const ticks=[0,.25,.5,.75,1].map(fr=>`<line x1="104" y1="${Y(max*fr)}" x2="610" y2="${Y(max*fr)}" stroke="#344b67" stroke-dasharray="4 5"/><text x="96" y="${Y(max*fr)+4}" text-anchor="end">${fmt(max*fr,2)}</text>`).join('');$('growthChart').innerHTML=`${ticks}<line x1="104" y1="260" x2="610" y2="260" stroke="#7895b8"/><line x1="104" y1="25" x2="104" y2="260" stroke="#7895b8"/><polyline points="${points}" fill="none" stroke="#f3c46b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(N)}" cy="${Y(max)}" r="5" fill="#f3c46b"/><text x="104" y="284">0</text><text x="610" y="284" text-anchor="end">${N} piegature</text><text x="104" y="18">Spessore (mm)</text>`}$('chartRange').oninput=e=>{state.chartMax=Number(e.target.value);$('maxN').textContent=state.chartMax;chart();save()};$('applyThickness').onclick=()=>{let t=Number($('thickness').value);if( else if(state.stage===5){c.innerHTML=`<div class="eyebrow">06 · Realtà o matematica?</div><h1>Un modello non è la realtà</h1>${scene()}<p>La matematica descrive cosa accadrebbe <strong>se</strong> lo spessore potesse raddoppiare a ogni piegatura, senza altri limiti.</p><div class="notice"><strong>Nel mondo reale:</strong> un normale foglio non può essere piegato 42 volte. Le sue dimensioni, la rigidità e la deformazione della carta rendono impossibile proseguire indefinitamente.</div><p>La distanza di <strong>384.400 km</strong> è una media: la Luna si avvicina e si allontana dalla Terra durante la sua orbita. L'esperimento usa una distanza di riferimento fissa.</p><p>La potenza del modello sta nel rendere comprensibile una crescita rapidissima, non nel promettere un viaggio fisicamente realizzabile.</p>${nav(true,true)}`;bindNav(true,true)}

e.choice!==null?`<div class="money-sim-intro">Hai scelto <strong>${state.choice==='million'?'il milione subito':'i raddoppi giornalieri'}</strong>. Ora osserva come cresce l’opzione B: <strong>raddoppia l’importo del singolo giorno</strong>, non il totale già accumulato. La simulazione mostra i raddoppi anche se hai scelto A.</div><div class="money-day"><label for="dayRange">Giorno della simulazione</label><strong><span id="dayLabel">${state.moneyDay}</span> / 30</strong></div><input type="range" min="1" max="30" value="${state.moneyDay}" id="dayRange"><div class="metrics money-metrics"><div class="metric"><small>Ricevi in questo giorno</small><b id="daily">${fmt(amount,2)} €</b></div><div class="metric"><small>Totale accumulato</small><b id="total">${fmt(total,2)} €</b></div></div><div class="money-chart-wrap"><div class="money-chart-legend"><span><i class="money-key fixed"></i>Opzione A: 1.000.000 €</span><span><i class="money-key growth"></i>Opzione B: totale accumulato</span></div><svg id="moneyChart" viewBox="0 0 700 310" role="img" aria-label="Confronto tra il milione fisso e il totale accumulato con i raddoppi, dal giorno 1 al giorno 30"></svg><p class="money-chart-note">Scala verticale lineare: nei primi giorni la crescita sembra quasi nulla rispetto ai valori finali. Il punto evidenzia il giorno selezionato.</p></div><div class="notice" id="moneyComparison" role="status"></div><div class="bar" role="progressbar" aria-label="Progresso dei 30 giorni" aria-valuemin="1" aria-valuemax="30" aria-valuenow="${state.moneyDay}" id="moneyProgress"><div id="moneyFill" style="width:${state.moneyDay/30*100}%"></div></div><div class="controls money-controls"><button class="primary" id="moneyPlay">▶ Avvia</button><button id="moneyPrev">← Passaggio precedente</button><button id="moneyStep">Passaggio successivo →</button><button id="moneyRestart">↺ Ricomincia</button><label>Velocità <select id="moneySpeed"><option value=".5">Lenta</option><option value="1">Normale</option><option value="2">Veloce</option><option value="4">Molto veloce</option></select></label></div><div id="moneyResult" class="money-final ${state.moneyDay===30?'':'hidden'}">In 30 giorni il totale è <strong>10.737.418,23 €</strong>, contro <strong>1.000.000 €</strong> dell'altra scelta. Il solo trentesimo giorno riceveresti <strong>5.368.709,12 €</strong>!</div>`:`<p class="muted">Seleziona un’opzione per scoprire cosa accade nei 30 giorni.</p>`}${nav(true,true)}`;c.querySelectorAll('[data-money]').forEach(b=>b.onclick=()=>{stop();state.choice=b.dataset.money;state.moneyDay=1;save();render()});if(state.choice!==null){let moneyLast=0,moneyAcc=0;const updateMoney=()=>{const d=state.moneyDay;$('dayRange').value=d;$('dayLabel').textContent=d;$('daily').textContent=fmt(.01*2**(d-1),2)+' €';$('total').textContent=fmt(.01*(2**d-1),2)+' €';$('moneyFill').style.width=d/30*100+'%';const fixed=1000000,cap=.01*(2**30-1),xx=n=>66+(n-1)/29*598,yy=v=>255-v/cap*220;const path=Array.from({length:30},(_,i)=>`${i===0?'M':'L'}${xx(i+1).toFixed(2)} ${yy(.01*(2**(i+1)-1)).toFixed(2)}`).join(' ');const sum=.01*(2**d-1);const grid=[0,2500000,5000000,7500000,10000000].map(v=>`<line x1="66" y1="${yy(v)}" x2="664" y2="${yy(v)}" stroke="#344b67" stroke-dasharray="4 5"/><text x="59" y="${yy(v)+4}" fill="#c9d9ed" font-size="12" text-anchor="end">${v===0?'0':(v/1e6).toLocaleString('it-IT',{maximumFractionDigits:1})+' M'}</text>`).join('');$('moneyChart').innerHTML=`${grid}<line x1="66" y1="255" x2="664" y2="255" stroke="#7895b8"/><line x1="66" y1="35" x2="66" y2="255" stroke="#7895b8"/><line x1="66" y1="${yy(fixed)}" x2="664" y2="${yy(fixed)}" stroke="#79b9ff" stroke-width="3" stroke-dasharray="9 5"/><path d="${path}" fill="none" stroke="#f3c46b" stroke-width="3.5" stroke-linecap="round"/><circle cx="${xx(d)}" cy="${yy(sum)}" r="6" fill="#f3c46b" stroke="#071427" stroke-width="2"/><text x="66" y="283" fill="#c9d9ed" font-size="13">1</text><text x="664" y="283" text-anchor="end" fill="#c9d9ed" font-size="13">30 giorni</text><text x="66" y="19" fill="#c9d9ed" font-size="13">Totale accumulato (€)</text>`;$('moneyComparison').innerHTML=sum>=fixed?`Al giorno <strong>${d}</strong> l’opzione B ha accumulato <strong>${fmt(sum,2)} €</strong> e ha superato il milione dell’opzione A.`:`Al giorno <strong>${d}</strong> l’opzione B ha accumulato <strong>${fmt(sum,2)} €</strong>: l’opzione A è ancora avanti.`;$('moneyProgress').setAttribute('aria-valuenow',d);$('moneyResult').classList.toggle('hidden',d!==30);$('moneyPlay').textContent=state.playing?'Ⅱ Pausa':'▶ Avvia';$('moneyPrev').disabled=d<=1;$('moneyStep').disabled=d>=30;save()};const moneyTick=t=>{if(!state.playing)return;if(!moneyLast)moneyLast=t;moneyAcc+=Math.min(100,t-moneyLast);moneyLast=t;const interval=700/state.speed;if(moneyAcc>=interval){moneyAcc%=interval;state.moneyDay=Math.min(30,state.moneyDay+1);if(state.moneyDay===30)stop();updateMoney()}if(state.playing)raf=requestAnimationFrame(moneyTick)};$('moneySpeed').value=String(state.speed);$('moneySpeed').onchange=e=>{state.speed=Number(e.target.value);save()};$('moneyPlay').onclick=()=>{if(state.playing){stop();updateMoney()}else{if(state.moneyDay===30)state.moneyDay=1;state.playing=true;moneyLast=0;moneyAcc=0;updateMoney();raf=requestAnimationFrame(moneyTick)}};$('moneyStep').onclick=()=>{stop();state.moneyDay=Math.min(30,state.moneyDay+1);updateMoney()};$('moneyPrev').onclick=()=>{stop();state.moneyDay=Math.max(1,state.moneyDay-1);updateMoney()};$('moneyRestart').onclick=()=>{stop();state.moneyDay=1;updateMoney()};$('dayRange').oninput=e=>{stop();state.moneyDay=Number(e.target.value);updateMoney()};updateMoney()}bindNav(true,true)}}
