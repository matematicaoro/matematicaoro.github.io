'use strict';const $=id=>document.getElementById(id),MOON=384400,BASE=.1,STAGES=7;let state={stage:0,guess:null,second:null,fold:0,recognized:false,sim:0,speed:1,playing:false,choice:null,moneyDay:1,moneyShown:false,thickness:.1,chartMax:15};let raf=0,last=0,acc=0;let classMode=false;let classPredictions=[];try{classPredictions=JSON.parse(sessionStorage.getItem('missione-luna-class')||'[]');if(!Array.isArray(classPredictions))classPredictions=[];classMode=sessionStorage.getItem('missione-luna-mode')==='class'}catch(e){classPredictions=[]}const fmt=(n,d=2)=>new Intl.NumberFormat('it-IT',{maximumFractionDigits:d}).format(n),km=(n,t=.1)=>t*2**n/1e6,foldNeeded=(t,d=MOON)=>Math.max(0,Math.ceil(Math.log2(d*1e6/t)-1e-12)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=n=>Number.isSafeInteger(n)&&n>=0&&n<=1000000000;function stop(){state.playing=false;cancelAnimationFrame(raf);raf=0;last=0;acc=0}function save(){try{sessionStorage.setItem('missione-luna-v1',JSON.stringify({...state,playing:false}))}catch(e){}}function restore(){try{let v=JSON.parse(sessionStorage.getItem('missione-luna-v1'));if(v&&Number.isInteger(v.stage)&&v.stage>=0&&v.stage<STAGES&&(!('guess'in v)||v.guess===null||safe(v.guess)))state={...state,...v,playing:false}}catch(e){}}function setStage(n){stop();state.stage=Math.max(0,Math.min(STAGES-1,n));save();render();window.scrollTo({top:0,behavior:'instant'})}function nav(back,next){return `<div class="footerNav"><button class="ghost" id="back" ${back?'':'disabled'}>← Indietro</button><button class="primary" id="next" ${next?'':'disabled'}>${state.stage===6?'Fine esperienza':'Continua →'}</button></div>`}function bindNav(back,next){$('back')?.addEventListener('click',()=>setStage(state.stage-1));$('next')?.addEventListener('click',()=>{if(state.stage===6){stop();state={stage:0,guess:null,second:null,fold:0,recognized:false,sim:0,speed:1,playing:false,choice:null,moneyDay:1,moneyShown:false,thickness:.1,chartMax:15};save();render()}else setStage(state.stage+1)})}function saveClass(){try{sessionStorage.setItem('missione-luna-class',JSON.stringify(classPredictions));sessionStorage.setItem('missione-luna-mode',classMode?'class':'single')}catch(e){}}function scene(){return `<div class="scene" role="img" aria-label="Rappresentazione artistica della Terra, della Luna e di un foglio"><div class="earth"></div><div class="beam"></div><div class="moon"></div><div class="paper" id="paper"></div></div>`}function travelScene(){return `<div class="travel-illustration" role="img" aria-label="Illustrazione del foglio: la lunghezza rappresenta la stessa frazione della distanza Terra-Luna indicata dalla barra sottostante"><svg viewBox="0 0 900 270" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><defs><radialGradient id="lunaEarth" cx="35%" cy="27%" r="75%"><stop stop-color="#7fe7f4"/><stop offset=".42" stop-color="#1d87c2"/><stop offset="1" stop-color="#072d63"/></radialGradient><radialGradient id="lunaMoon" cx="32%" cy="27%" r="72%"><stop stop-color="#fffdf1"/><stop offset=".56" stop-color="#c7cbd2"/><stop offset="1" stop-color="#687b94"/></radialGradient><linearGradient id="lunaPaper" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fff9dc"/><stop offset=".55" stop-color="#f3c46b"/><stop offset="1" stop-color="#a87331"/></linearGradient><filter id="lunaGlow"><feGaussianBlur stdDeviation="5"/></filter></defs><g fill="#d9eaff" opacity=".75"><circle cx="235" cy="32" r="1.8"/><circle cx="400" cy="52" r="1.2"/><circle cx="580" cy="24" r="1.5"/><circle cx="690" cy="220" r="1.5"/><circle cx="328" cy="219" r="1"/><circle cx="524" cy="204" r="1.3"/></g><circle cx="110" cy="132" r="91" fill="#42b7ff" opacity=".16" filter="url(#lunaGlow)"/><circle cx="110" cy="132" r="76" fill="url(#lunaEarth)"/><path d="M65 81l30-10 15 11 3 17 21 9-6 16-19-2-8 19-22-7-4-18-20-11zM119 158l24-10 21 15-11 17-5 26-16 11-15-25zM74 163l15 7 6 21-17 10-11-18z" fill="#4bbf9a" opacity=".94"/><path d="M60 114l29-5 21 7M124 75l23 13" fill="none" stroke="#d9ffff" stroke-width="7" opacity=".38" stroke-linecap="round"/><circle cx="784" cy="130" r="70" fill="#e9f0fa" opacity=".18" filter="url(#lunaGlow)"/><circle cx="784" cy="130" r="60" fill="url(#lunaMoon)"/><g fill="#8493a8" opacity=".42"><circle cx="766" cy="102" r="12"/><circle cx="809" cy="147" r="17"/><circle cx="770" cy="164" r="8"/><circle cx="815" cy="100" r="7"/><circle cx="790" cy="123" r="6"/></g><path d="M190 130H714" stroke="#c9d4e8" stroke-width="2" stroke-dasharray="6 9" opacity=".5"/><g id="travelPaperGroup"><rect id="travelPaperShadow" x="190" y="126" width="3" height="9" rx="3" fill="#f3c46b" opacity=".35" filter="url(#lunaGlow)"/><rect id="travelPaperBody" x="190" y="126" width="3" height="9" rx="2" fill="url(#lunaPaper)" stroke="#ffe6a0" stroke-width="1"/><path id="travelPaperTop" d="M190 126 H193" fill="none" stroke="#fff8e3" stroke-width="2"/><circle id="travelPaperTip" cx="193" cy="130" r="5" fill="#fff4c7" stroke="#f1bc4c" stroke-width="2"/></g><text x="110" y="240" text-anchor="middle" fill="#cfe7ff" font-size="18" font-weight="700">TERRA</text><text x="784" y="224" text-anchor="middle" fill="#e9e9f4" font-size="18" font-weight="700">LUNA</text><text x="455" y="248" text-anchor="middle" fill="#b9cce4" font-size="15">Avanzamento sulla stessa scala lineare della barra</text></svg><div class="travel-caption" aria-live="off">Spessore dopo <strong id="travelFoldCount">0</strong> piegature: <strong id="travelThickness">0,1 mm</strong></div></div>`}function render(){const labels=['La sfida','L’esperimento','Il viaggio','La rivelazione','La regola','Realtà e modello','Nuova sfida'];$('stepper').innerHTML=labels.map((x,i)=>`<i class="${i<=state.stage?'on':''}" title="${x}"></i>`).join('');const c=$('content');if(state.stage===0){c.innerHTML=`<div class="eyebrow">01 · Il mistero</div><h1>Un foglio di carta può raggiungere la Luna?</h1>${scene()}<p>Un normalissimo foglio di carta è spesso appena <strong>0,1 millimetri</strong>. Immagina di piegarlo a metà, poi ancora a metà, e continuare così.</p><p><strong>Quante piegature servirebbero affinché il suo spessore raggiunga la distanza media tra la Terra e la Luna, circa 384.400 km?</strong></p><div class="controls" role="group" aria-label="Modalità di raccolta"><button type="button" id="singleMode" aria-pressed="${!classMode}">Una previsione</button><button type="button" id="classMode" aria-pressed="${classMode}">Previsioni della classe</button></div><p class="muted">Scegli una modalità: una sola risposta oppure fino a 50 previsioni della classe. Non occorre compilare entrambe.</p><div class="${classMode?'hidden':''}"><form id="guessForm" class="field"><label>La tua previsione<input id="guess" type="number" min="0" max="1000000000" step="1" inputmode="numeric" required placeholder="Scrivi un numero" ${state.guess!==null?'disabled value="'+state.guess+'"':''}></label><button class="primary" type="submit" ${state.guess!==null?'disabled':''}>Conferma la mia previsione</button></form><div id="err" role="alert"></div>${state.guess!==null?`<div class="notice">Previsione registrata: <strong>${fmt(state.guess,0)} piegature</strong>. Non sarà modificata durante l'esperienza.</div>`:''}</div><div class="${classMode?'':'hidden'}"><form id="classForm" class="field"><label>Studente (numero da 1 a 50)<input id="studentNo" type="number" min="1" max="50" step="1" required value="${Math.min(50,classPredictions.length+1)}"></label><label>Previsione (piegature)<input id="studentGuess" type="number" min="0" max="1000000000" step="1" required></label><button class="primary">Registra</button></form><div id="classError" role="alert"></div><div class="tablewrap"><table><thead><tr><th>Studente</th><th>Previsione</th><th></th></tr></thead><tbody>${classPredictions.map(x=>`<tr><td>${x.id}</td><td>${fmt(x.value,0)}</td><td><button type="button" data-remove="${x.id}">Elimina</button></td></tr>`).join('')}</tbody></table></div><p class="muted">${classPredictions.length} / 50 previsioni registrate · I dati restano in questo browser.</p><button type="button" id="exportClass" ${classPredictions.length?'':'disabled'}>Esporta CSV</button></div>${nav(false,classMode?classPredictions.length>0:state.guess!==null)}`;$('singleMode').onclick=()=>{classMode=false;saveClass();render()};$('classMode').onclick=()=>{classMode=true;saveClass();render()};$('classForm').onsubmit=e=>{e.preventDefault();let id=Number($('studentNo').value),v=Number($('studentGuess').value);if(!Number.isInteger(id)||id<1||id>50||!safe(v)||!$('studentGuess').value.trim()){$('classError').textContent='Inserisci uno studente da 1 a 50 e una previsione intera valida.';return}classPredictions=classPredictions.filter(x=>x.id!==id);classPredictions.push({id,value:v});classPredictions.sort((a,b)=>a.id-b.id);saveClass();render()};c.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{classPredictions=classPredictions.filter(x=>x.id!==Number(b.dataset.remove));saveClass();render()});$('exportClass').onclick=()=>{let csv='Studente;Previsione\n'+classPredictions.map(x=>`${x.id};${x.value}`).join('\n');let url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='missione-luna-previsioni.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('guessForm').onsubmit=e=>{e.preventDefault();const n=Number($('guess').value);if(!safe(n)||$('guess').value.trim()===''){$('err').textContent='Inserisci un numero intero tra 0 e 1.000.000.000.';return}state.guess=n;save();render()};bindNav(false,classMode?classPredictions.length>0:state.guess!==null)}
else if(state.stage===1){c.innerHTML=`<div class="eyebrow">02 · Il primo esperimento</div><h1>Che cosa succede a ogni piega?</h1><p>Osserva i primi raddoppi. Questa è una rappresentazione <strong>schematica</strong>: non mostra la difficoltà fisica di piegare davvero il foglio.</p><div class="stack"><div id="stack"></div></div><div class="metrics"><div class="metric"><small>Piegature</small><b id="foldNumber"></b></div><div class="metric"><small>Strati</small><b id="layers"></b></div><div class="metric"><small>Spessore</small><b id="thick"></b></div><div class="metric"><small>Rispetto all'inizio</small><b id="multiple"></b></div></div><div class="controls"><button id="fold" class="primary">Piega il foglio</button><button id="unfold">← Una piega indietro</button></div><div class="tablewrap"><table><thead><tr><th>Piegature</th><th>Strati</th><th>Spessore (mm)</th></tr></thead><tbody id="foldTable"></tbody></table></div><div class="notice"><strong>Indaga:</strong> di quanto si moltiplica lo spessore a ogni piegatura?</div><div class="choice" id="recognition"><button data-answer="1.5">× 1,5</button><button data-answer="2">× 2</button><button data-answer="3">× 3</button></div><div id="feedback" role="status"></div>${nav(true,state.recognized&&state.fold>=3)}`;function upd(){const f=state.fold;$('foldNumber').textContent=f;$('layers').textContent=fmt(2**f,0);$('thick').textContent=fmt(.1*2**f,3)+' mm';$('multiple').textContent='× '+fmt(2**f,0);$('stack').style.height=Math.min(120,12+f*14)+'px';$('fold').disabled=f>=8;$('unfold').disabled=f<=0;$('foldTable').innerHTML=Array.from({length:f+1},(_,i)=>`<tr><td>${i}</td><td>${fmt(2**i,0)}</td><td>${fmt(.1*2**i,3)}</td></tr>`).join('');$('next').disabled=!(state.recognized&&f>=3)}upd();$('fold').onclick=()=>{state.fold=Math.min(8,state.fold+1);$('stack').classList.remove('fold');void $('stack').offsetWidth;$('stack').classList.add('fold');upd();save()};$('unfold').onclick=()=>{state.fold=Math.max(0,state.fold-1);upd();save()};$('recognition').onclick=e=>{const b=e.target.closest('button[data-answer]');if(!b)return;if(b.dataset.answer==='2'){state.recognized=true;$('feedback').textContent='Esatto! Ogni piegatura raddoppia lo spessore.';upd();save()}else $('feedback').textContent='Osserva due righe consecutive della tabella e riprova.'};bindNav(true,state.recognized&&state.fold>=3)}
else if(state.stage===2){c.innerHTML=`<div class="eyebrow">03 · Il viaggio</div><h1>Quanto lontano possiamo arrivare?</h1>${travelScene()}<label for="simRange">Piegature: <strong id="simLabel"></strong></label><input id="simRange" type="range" min="0" max="42" step="1" value="${state.sim}"><div class="metrics"><div class="metric"><small>Numero di strati</small><b id="simLayers"></b></div><div class="metric"><small>Spessore teorico</small><b id="simKm"></b></div><div class="metric"><small>Distanza ancora da percorrere</small><b id="remaining"></b></div><div class="metric"><small>Confronto</small><b id="comparison"></b></div></div><p class="bar-explanation">Ogni passo raddoppia lo spessore teorico. La barra qui sotto indica la <strong>frazione della distanza Terra-Luna raggiunta</strong> ed è in scala lineare; per questo all’inizio sembra immobile.</p><div class="bar-arrow" aria-hidden="true">↓</div><div class="bar"><div id="distanceBar"></div></div><div class="controls"><button id="play" class="primary">▶ Avvia</button><button id="prev">← Passaggio precedente</button><button id="step">Passaggio successivo →</button><button id="restart">↺ Ricomincia</button><label>Velocità <select id="speed"><option value=".5">Lenta</option><option value="1">Normale</option><option value="2">Veloce</option><option value="4">Molto veloce</option></select></label></div><div class="notice" id="milestone"></div><p class="muted">Confronti indicativi: 1 m = 0,001 km; 1 km = 1 km; quota di 100 km come riferimento convenzionale per il limite dello spazio.</p>${nav(true,state.sim===42)}`;$('speed').value=String(state.speed);function upd(){let n=state.sim,k=km(n);$('simRange').value=n;$('simLabel').textContent=n;$('simLayers').textContent=fmt(2**n,0);$('simKm').textContent=k<.001?fmt(k*1e6,3)+' mm':k<1?fmt(k*1000,3)+' m':fmt(k,3)+' km';$('remaining').textContent=fmt(Math.max(0,MOON-k),3)+' km';$('comparison').textContent=k>=MOON?'Distanza superata':k>=100?'Oltre 100 km':k>=1?'Oltre 1 km':k>=.001?'Oltre 1 m':'Meno di 1 m';$('distanceBar').style.width=Math.min(100,k/MOON*100)+'%';const travelFraction=Math.min(1,k/MOON),travelEnd=193+travelFraction*521,travelHeight=9+travelFraction*35,travelY=130-travelHeight/2;$('travelPaperBody').setAttribute('width',String(Math.max(3,travelEnd-190)));$('travelPaperBody').setAttribute('height',String(travelHeight));$('travelPaperBody').setAttribute('y',String(travelY));$('travelPaperShadow').setAttribute('width',String(Math.max(3,travelEnd-190)));$('travelPaperShadow').setAttribute('height',String(travelHeight));$('travelPaperShadow').setAttribute('y',String(travelY));$('travelPaperTop').setAttribute('d',`M190 ${travelY+2} H${travelEnd}`);$('travelPaperTip').setAttribute('cx',String(travelEnd));$('travelFoldCount').textContent=n;$('travelThickness').textContent=k<.001?fmt(k*1e6,3)+' mm':k<1?fmt(k*1000,3)+' m':fmt(k,3)+' km';$('milestone').textContent=k>=MOON?'Hai raggiunto la distanza media della Luna! Prosegui per scoprire il risultato.':k>=100?'Hai superato i 100 km: una quota spesso usata come riferimento per l’inizio dello spazio.':k>=1?'Lo spessore supera un chilometro.':k>=.001?'Hai superato un metro.':'Osserva: i primi raddoppi sono quasi invisibili rispetto alla distanza della Luna.';$('next').disabled=n!==42;$('prev').disabled=n===0;$('step').disabled=n===42;$('play').textContent=state.playing?'Ⅱ Pausa':'▶ Avvia';save()}function advance(){if(state.sim<42){state.sim++;upd()}if(state.sim===42)stop()}function tick(t){if(!state.playing)return;if(!last)last=t;acc+=Math.min(100,t-last);last=t;const interval=700/state.speed;if(acc>=interval){acc%=interval;advance()}if(state.playing)raf=requestAnimationFrame(tick);else upd()}$('play').onclick=()=>{if(state.playing){stop();upd()}else{if(state.sim===42)state.sim=0;state.playing=true;last=0;acc=0;upd();raf=requestAnimationFrame(tick)}};$('step').onclick=()=>{stop();advance();upd()};$('prev').onclick=()=>{stop();state.sim=Math.max(0,state.sim-1);upd()};$('restart').onclick=()=>{stop();state.sim=0;upd()};$('simRange').oninput=e=>{stop();state.sim=Number(e.target.value);upd()};$('speed').onchange=e=>{state.speed=Number(e.target.value);save()};upd();bindNav(true,state.sim===42)}
else if(state.stage===3){const k41=km(41),k42=km(42);c.innerHTML=`<div class="eyebrow">04 · La rivelazione</div><h1>Il mistero è risolto</h1>${scene()}<div class="reveal">42</div><div class="progressText">piegature teoriche</div><p>Con 41 piegature lo spessore è <strong>${fmt(k41,3)} km</strong>: non basta. Con 42 piegature raggiunge <strong>${fmt(k42,3)} km</strong>, superando la distanza media Terra-Luna di 384.400 km.</p><div class="notice"><strong>Previsione iniziale:</strong> ${state.guess===null?'Non inserita':fmt(state.guess,0)+' piegature'}</div><div class="notice">La matematica può sorprenderci proprio quando la nostra intuizione sembra più sicura. Una previsione diversa dal risultato è un ottimo punto di partenza per capire perché.</div>${nav(true,true)}`;bindNav(true,true)}
else if(state.stage===4){let n=foldNeeded(state.thickness);c.innerHTML=`<div class="eyebrow">05 · Scopri la regola</div><h1>La potenza nascosta</h1><p>Partiamo da un foglio spesso <strong>0,1 mm</strong>. Ogni volta che lo pieghiamo, lo spessore <strong>raddoppia</strong>: non aggiungiamo sempre 0,1 mm, ma moltiplichiamo per 2 il valore precedente.</p><div class="ruleSteps" aria-label="Costruzione progressiva della formula"><div class="ruleStep"><small>0 piegature</small><strong>0,1 mm</strong><span>Spessore iniziale</span></div><div class="ruleArrow" aria-hidden="true">× 2 →</div><div class="ruleStep"><small>1 piegatura</small><strong>0,2 mm</strong><span>0,1 × 2</span></div><div class="ruleArrow" aria-hidden="true">× 2 →</div><div class="ruleStep"><small>2 piegature</small><strong>0,4 mm</strong><span>0,1 × 2 × 2</span></div><div class="ruleArrow" aria-hidden="true">× 2 →</div><div class="ruleStep"><small>3 piegature</small><strong>0,8 mm</strong><span>0,1 × 2 × 2 × 2</span></div></div><p>Il numero di fattori <strong>2</strong> è uguale al numero delle piegature. Per questo possiamo scrivere:</p><div class="notice ruleFormula"><div>0,1 × 2 × 2 × … × 2</div><div class="ruleFormulaArrow" aria-hidden="true">↓</div><strong>s(n) = 0,1 × 2<sup>n</sup> mm</strong><small>n = numero di piegature · 2<sup>n</sup> = prodotto di n fattori uguali a 2</small></div><p>Ora osserva la <strong>curva dorata</strong>: rappresenta soltanto lo spessore del foglio che raddoppia. Sposta il cursore per scoprire come cambia il grafico.</p><label>Mostra fino a <strong id="maxN">${state.chartMax}</strong> piegature<input type="range" id="chartRange" min="3" max="25" value="${state.chartMax}"></label><div class="notice" id="chartValue" aria-live="polite"></div><svg id="growthChart" class="chart" viewBox="0 0 640 300" role="img" aria-label="Grafico dello spessore esponenziale del foglio in funzione delle piegature"></svg><p class="muted">Curva dorata: crescita esponenziale. Asse orizzontale: piegature. Asse verticale: spessore in millimetri; la scala si adatta al numero massimo di piegature selezionato.</p><div class="field"><label>Spessore iniziale (mm)<input id="thickness" type="number" min="0.000001" max="1000000" step="any" value="${state.thickness}"></label><button id="applyThickness">Ricalcola</button></div><div class="notice" id="thicknessResult">Con ${fmt(state.thickness,6)} mm occorrono <strong>${n} piegature</strong> per raggiungere la distanza media Terra-Luna.</div><details><summary>Altre domande da esplorare</summary><p>Se il foglio è spesso 0,2 mm, serve una piegatura in meno. Per raggiungere 1 km con un foglio spesso 0,1 mm servono <strong>${foldNeeded(.1,1)}</strong> piegature. Ogni nuova piegatura moltiplica per due il risultato precedente.</p></details>${nav(true,true)}`;function chart(){let N=state.chartMax,max=.1*2**N;$('chartValue').innerHTML=`Dopo <strong>${N} piegature</strong>: spessore <strong>${fmt(max,2)} mm</strong> (${fmt(max/1000,5)} m).`; const X=n=>104+n/N*506,Y=y=>260-y/max*215;const points=Array.from({length:N+1},(_,i)=>`${X(i)},${Y(.1*2**i)}`).join(' ');const ticks=[0,.25,.5,.75,1].map(fr=>`<line x1="104" y1="${Y(max*fr)}" x2="610" y2="${Y(max*fr)}" stroke="#344b67" stroke-dasharray="4 5"/><text x="96" y="${Y(max*fr)+4}" text-anchor="end">${fmt(max*fr,2)}</text>`).join('');$('growthChart').innerHTML=`${ticks}<line x1="104" y1="260" x2="610" y2="260" stroke="#7895b8"/><line x1="104" y1="25" x2="104" y2="260" stroke="#7895b8"/><polyline points="${points}" fill="none" stroke="#f3c46b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(N)}" cy="${Y(max)}" r="5" fill="#f3c46b"/><text x="104" y="284">0</text><text x="610" y="284" text-anchor="end">${N} piegature</text><text x="104" y="18">Spessore (mm)</text>`}$('chartRange').oninput=e=>{state.chartMax=Number(e.target.value);$('maxN').textContent=state.chartMax;chart();save()};$('applyThickness').onclick=()=>{let t=Number($('thickness').value);if(!Number.isFinite(t)||t<.000001||t>1000000){$('thicknessResult').textContent='Inserisci uno spessore compreso tra 0,000001 e 1.000.000 mm.';return}state.thickness=t;$('thicknessResult').innerHTML=`Con ${fmt(t,6)} mm occorrono <strong>${foldNeeded(t)} piegature</strong> per raggiungere la distanza media Terra-Luna.`;save()};chart();bindNav(true,true)}
else if(state.stage===5){c.innerHTML=`<div class="eyebrow">06 · Realtà o matematica?</div><h1>Un modello non è la realtà</h1>${scene()}<p>La matematica descrive cosa accadrebbe <strong>se</strong> lo spessore potesse raddoppiare a ogni piegatura, senza altri limiti.</p><div class="notice"><strong>Nel mondo reale:</strong> un normale foglio non può essere piegato 42 volte. Le sue dimensioni, la rigidità e la deformazione della carta rendono impossibile proseguire indefinitamente.</div><p>La distanza di <strong>384.400 km</strong> è una media: la Luna si avvicina e si allontana dalla Terra durante la sua orbita. L'esperimento usa una distanza di riferimento fissa.</p><p>La potenza del modello sta nel rendere comprensibile una crescita rapidissima, non nel promettere un viaggio fisicamente realizzabile.</p>${nav(true,true)}`;bindNav(true,true)}
else{let amount=.01*2**(state.moneyDay-1),total=.01*(2**state.moneyDay-1);c.innerHTML=`<div class="eyebrow">07 · Una nuova sfida, facoltativa</div><h1>Un milione subito… oppure un importo che raddoppia ogni giorno?</h1><p>Preferiresti ricevere <strong>1.000.000 € subito</strong> oppure <strong>incassare ogni giorno un importo doppio rispetto al giorno precedente, partendo da un centesimo</strong>, per 30 giorni?</p><div class="choice"><button data-money="million" class="${state.choice==='million'?'selected':''}">Un milione subito</button><button data-money="double" class="${state.choice==='double'?'selected':''}">Parti da 1 centesimo e ogni giorno incassi il doppio del giorno precedente</button></div>${state.choice!==null?`<div class="notice">Hai scelto: <strong>${state.choice==='million'?'un milione subito':'un importo che raddoppia ogni giorno, partendo da un centesimo'}</strong>. <strong>Simulazione: raddoppi l’importo ogni giorno, partendo da un centesimo.</strong> Ogni giorno ricevi il doppio del giorno precedente; il totale accumulato è invece la somma degli importi ricevuti. L’animazione mostra sempre questa seconda opzione, anche se hai scelto il milione immediato.</div><label for="dayRange">Giorno: <strong id="dayLabel">${state.moneyDay}</strong> di 30</label><input type="range" min="1" max="30" value="${state.moneyDay}" id="dayRange"><div class="metrics"><div class="metric"><small>Importo ricevuto nel giorno</small><b id="daily">${fmt(amount,2)} €</b></div><div class="metric"><small>Totale accumulato con i raddoppi</small><b id="total">${fmt(total,2)} €</b></div></div><div class="bar" role="progressbar" aria-label="Progresso dei 30 giorni" aria-valuemin="1" aria-valuemax="30" aria-valuenow="${state.moneyDay}" id="moneyProgress"><div id="moneyFill" style="width:${state.moneyDay/30*100}%"></div></div><div class="controls"><button class="primary" id="moneyPlay">▶ Avvia</button><button id="moneyPrev">← Passaggio precedente</button><button id="moneyStep">Passaggio successivo →</button><button id="moneyRestart">↺ Ricomincia</button><label>Velocità <select id="moneySpeed"><option value=".5">Lenta</option><option value="1">Normale</option><option value="2">Veloce</option><option value="4">Molto veloce</option></select></label></div><div id="moneyResult" class="notice ${state.moneyDay===30?'':'hidden'}">In 30 giorni il totale è <strong>10.737.418,23 €</strong>, contro <strong>1.000.000 €</strong> dell'altra scelta. Il solo trentesimo giorno riceveresti <strong>5.368.709,12 €</strong>!</div>`:`<p class="muted">Scegli una delle due opzioni per iniziare la simulazione.</p>`}${nav(true,true)}`;c.querySelectorAll('[data-money]').forEach(b=>b.onclick=()=>{stop();state.choice=b.dataset.money;state.moneyDay=1;save();render()});if(state.choice!==null){let moneyLast=0,moneyAcc=0;const updateMoney=()=>{const d=state.moneyDay;$('dayRange').value=d;$('dayLabel').textContent=d;$('daily').textContent=fmt(.01*2**(d-1),2)+' €';$('total').textContent=fmt(.01*(2**d-1),2)+' €';$('moneyFill').style.width=d/30*100+'%';$('moneyProgress').setAttribute('aria-valuenow',d);$('moneyResult').classList.toggle('hidden',d!==30);$('moneyPlay').textContent=state.playing?'Ⅱ Pausa':'▶ Avvia';$('moneyPrev').disabled=d<=1;$('moneyStep').disabled=d>=30;save()};const moneyTick=t=>{if(!state.playing)return;if(!moneyLast)moneyLast=t;moneyAcc+=Math.min(100,t-moneyLast);moneyLast=t;const interval=700/state.speed;if(moneyAcc>=interval){moneyAcc%=interval;state.moneyDay=Math.min(30,state.moneyDay+1);if(state.moneyDay===30)stop();updateMoney()}if(state.playing)raf=requestAnimationFrame(moneyTick)};$('moneySpeed').value=String(state.speed);$('moneySpeed').onchange=e=>{state.speed=Number(e.target.value);save()};$('moneyPlay').onclick=()=>{if(state.playing){stop();updateMoney()}else{if(state.moneyDay===30)state.moneyDay=1;state.playing=true;moneyLast=0;moneyAcc=0;updateMoney();raf=requestAnimationFrame(moneyTick)}};$('moneyStep').onclick=()=>{stop();state.moneyDay=Math.min(30,state.moneyDay+1);updateMoney()};$('moneyPrev').onclick=()=>{stop();state.moneyDay=Math.max(1,state.moneyDay-1);updateMoney()};$('moneyRestart').onclick=()=>{stop();state.moneyDay=1;updateMoney()};$('dayRange').oninput=e=>{stop();state.moneyDay=Number(e.target.value);updateMoney()};updateMoney()}bindNav(true,true)}}
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('Schermo intero non disponibile in questo browser.')}};document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'⛶ Esci da schermo intero':'⛶ Schermo intero';});$('reset').onclick=()=>{if(!confirm('Vuoi ricominciare e cancellare le previsioni di questa sessione?'))return;stop();sessionStorage.removeItem('missione-luna-v1');sessionStorage.removeItem('missione-luna-class');sessionStorage.removeItem('missione-luna-mode');location.reload()};document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();save()}});restore();render();
</script><div class="mo-tools" role="navigation" aria-label="Navigazione MatematicaOro"><a href="../../index.html">⌂ Home</a><a href="../index.html">☰ Laboratorio</a></div><script>(function(){var d=document,f=String.fromCharCode,c=f(99,111,110,116,101,120,116,109,101,110,117),g=f(100,114,97,103,115,116,97,114,116);d.addEventListener(c,function(e){e.preventDefault()},true);d.addEventListener(g,function(e){e.preventDefault()},true);d.addEventListener("keydown",function(e){var k=(e.key||"").toLowerCase();if((e.ctrlKey||e.metaKey)&&(k==="u"||k==="s")||e.key==="F12"){e.preventDefault();e.stopPropagation()}},true)})();</script></body></html>
