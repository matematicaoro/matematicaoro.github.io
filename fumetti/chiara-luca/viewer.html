let idx=0,zoom=1;
const viewer=document.getElementById('viewer'),chooser=document.getElementById('chooser'),label=document.getElementById('zoomLabel');
function apply(){
 document.querySelectorAll('.stage').forEach(stage=>{
  stage.style.transform=`scale(${zoom})`;
  stage.style.marginBottom=((stage.offsetHeight*zoom)-stage.offsetHeight+16)+'px';
 });
 label.textContent=Math.round(zoom*100)+'%';viewer.scrollLeft=0;
}
function resetWidth(){zoom=1;document.querySelectorAll('.stage').forEach(s=>{s.style.width='100%';s.style.maxWidth='1024px'});apply();window.scrollTo({top:0,behavior:'auto'})}
function fitPage(){
 const first=document.querySelector('.comic');if(!first)return;
 document.querySelectorAll('.stage').forEach(s=>{s.style.width='1024px';s.style.maxWidth='1024px'});
 const ah=window.innerHeight-document.querySelector('.toolbar').offsetHeight-100,aw=window.innerWidth-32;
 zoom=Math.min(aw/first.naturalWidth,ah/first.naturalHeight);apply();window.scrollTo({top:0,behavior:'auto'});
}
function render(){
 const x=items[idx];document.title=x.id+' · '+x.title+' · MatematicaOro';
 document.getElementById('title').textContent=x.id+' · '+x.title;
 document.getElementById('pagecount').textContent=x.pages.length>1?('Storia in '+x.pages.length+' pagine'):'';
 viewer.innerHTML='';
 x.pages.forEach((src,i)=>{
  const s=document.createElement('div');s.className='stage';
  const im=document.createElement('img');im.className='comic';im.src=src;im.alt=x.id+' – '+x.title+(x.pages.length>1?' – pagina '+(i+1):'');
  im.onload=()=>{if(i===0)resetWidth()};
  im.onerror=()=>{s.innerHTML='<div style="padding:30px;background:#fff;color:#b91c1c">Immagine non trovata: '+src+'</div>'};
  s.appendChild(im);viewer.appendChild(s);
 });
 chooser.value=idx;
 try{history.replaceState(null,'','#'+x.id)}catch(e){}
}
function go(n){idx=(n+items.length)%items.length;render()}
items.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.id+' · '+x.title;chooser.appendChild(o)});
const q=location.hash.replace('#','');
const f=items.findIndex(x=>x.id===q);idx=f>=0?f:0;render();
document.getElementById('prev').onclick=()=>go(idx-1);document.getElementById('prev2').onclick=()=>go(idx-1);
document.getElementById('next').onclick=()=>go(idx+1);document.getElementById('next2').onclick=()=>go(idx+1);
chooser.onchange=e=>go(+e.target.value);
document.getElementById('fitWidth').onclick=resetWidth;document.getElementById('fitPage').onclick=fitPage;
document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(zoom+.15,3);apply()};
document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(zoom-.15,.35);apply()};label.onclick=resetWidth;
document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
const stop=e=>e.preventDefault();['contextmenu','dragstart','copy','cut','selectstart'].forEach(x=>document.addEventListener(x,stop,{capture:true}));
document.addEventListener('keydown',e=>{const k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&['s','u','p','c'].includes(k)){e.preventDefault();e.stopPropagation()}if(e.key==='F12'){e.preventDefault();e.stopPropagation()}},{capture:true});
