name: Aggiorna novità MatematicaOro
on:
  push:
    branches: [main]
    paths:
      - 'fumetti/chiara-luca/tavole.json'
      - 'fumetti/chiara-luca/assets/**'
      - 'lezioni/**'
      - 'esercizi/**'
      - 'teoria/**'
      - 'schemi/**'
      - '.github/scripts/aggiorna_novita.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  novita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calcola date di prima pubblicazione
        run: |
          python3 .github/scripts/date_pubblicazione_tavole.py
          python3 .github/scripts/aggiorna_novita.py
      - name: Salva cataloghi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fumetti/chiara-luca/tavole.json novita-sezioni.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna novità pubblicate [skip ci]"
            git push
          fi
